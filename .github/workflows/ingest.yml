name: Ingest submissions

on:
  push:
    branches: [main]
    paths:
      - "submissions/**.json"
      - "missing/**.json"

permissions:
  contents: write

jobs:
  ingest:
    # ostdbbot (the soundtracks-sync worker) pushes empty missing/ placeholders
    # and index pages straight to main; there is nothing to ingest in those.
    # A PR merge is different even when ostdbbot is the actor: auto-merge
    # merges as the account that enabled it, which for suggestion PRs is
    # ostdbbot, and the merged soundtrack still has to be ingested.
    if: github.actor != 'ostdbbot' || startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      # The repository has 200k+ commits and 250k+ placeholder files, so a full
      # clone took ~50 minutes per merge. Fetch only this push (HEAD and its
      # parents), no file contents up front, and no working tree beyond
      # .github; the changed submission files are added below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Find changed submission files
        id: files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A merge's "before" is its first parent, already fetched. A push of
          # several commits needs the old tip fetched on its own.
          if ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA" 2>/dev/null || true
          fi
          if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            # First push, or a force-push GitHub can't diff against — fall back
            # to comparing against the empty tree so every current file counts.
            BASE=$(git hash-object -t tree /dev/null)
          fi

          FILES=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'submissions/*.json' 'missing/*.json' | grep -v 'TEMPLATE.json' || true)

          MAX_FILES=20
          COUNT=$(echo "$FILES" | grep -c . || true)
          if [ "$COUNT" -gt "$MAX_FILES" ]; then
            echo "::error::$COUNT submission files changed in one push (max $MAX_FILES). Split this into smaller pushes/PRs."
            exit 1
          fi

          # Put just these files into the sparse working tree.
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | sed 's#^#/#' | git sparse-checkout add --stdin
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed submission files:"
          echo "$FILES"

      - name: Build payload and send to ingest endpoint
        if: steps.files.outputs.files != ''
        env:
          FILES: ${{ steps.files.outputs.files }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -e
          PAYLOAD="[]"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            ITEM=$(cat "$file")
            if ! echo "$ITEM" | jq empty 2>/dev/null; then
              echo "::error file=$file::Not valid JSON"
              exit 1
            fi
            AUTHOR=$(git log -1 --format='%an' -- "$file")
            ITEM=$(echo "$ITEM" | jq --arg by "$AUTHOR" '. + {submitted_by: $by}')
            PAYLOAD=$(echo "$PAYLOAD" | jq --argjson item "$ITEM" '. + [$item]')
          done <<< "$FILES"

          echo "Payload:"
          echo "$PAYLOAD" | jq .

          if [ "$(echo "$PAYLOAD" | jq 'length')" = "0" ]; then
            echo "Nothing valid to ingest."
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/ingest-result.json -w "%{http_code}" -X POST \
            "https://ostdb-soundtracks-sync.metjum.workers.dev/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: $ADMIN_SECRET" \
            -d "$PAYLOAD")

          echo "HTTP $HTTP_CODE"
          cat /tmp/ingest-result.json | jq . || cat /tmp/ingest-result.json

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Ingest request failed with HTTP $HTTP_CODE"
            exit 1
          fi

          if ! FAILED=$(jq -r '.failed | length' /tmp/ingest-result.json); then
            echo "::error::Ingest endpoint returned invalid JSON"
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED submission(s) failed during ingest"
            exit 1
          fi

      - name: Remove processed submission files
        if: steps.files.outputs.files != '' && success()
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            git rm -q "$file"
          done <<< "$FILES"

          if ! git diff --cached --quiet; then
            git config user.name "ostdb-bot"
            git config user.email "bot@ostdb.net"
            git commit -m "Remove processed submissions"
            # The sync worker commits to main every few minutes, so the push
            # can race it; rebase onto the new main and try again.
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              sleep $((attempt * 5))
              git fetch --quiet --no-tags --deepen=50 --filter=blob:none origin main
              git rebase --quiet origin/main
            done
            echo "::warning::Could not remove processed files (main kept moving). They were ingested; the worker cleans up missing/ placeholders on its next sync."
          fi
